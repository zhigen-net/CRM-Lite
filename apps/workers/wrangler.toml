name = "placeholder-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 前端静态资源（apps/web 构建产物）与 API 由同一个 Worker 提供
# - 静态资源请求不进入 Worker 脚本，免费且不计入请求额度
# - 只有 /api/* 先进入 Worker；其余未命中文件的路径回退到 index.html（SPA）
# 部署前须先构建前端：pnpm build:web
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 持久化 Worker 日志（console.log、异常、请求记录），可在控制台 Observability 或 API 中查询
[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "placeholder-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "placeholder-store"

[[queues.producers]]
binding = "LEAD_ASSIGNMENT_QUEUE"
queue = "placeholder-leads"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "placeholder-notify"

[[queues.consumers]]
queue = "placeholder-leads"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "placeholder-notify"
max_batch_size = 20
max_batch_timeout = 10

[ai]
binding = "AI"

[triggers]
crons = ["0 1 * * *"]

[dev]
port = 8787
